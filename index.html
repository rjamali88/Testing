<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heavenfall Asteroids</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6fbff;
      font-family: Arial, sans-serif;
      color: #f7f8ff;
    }
    .wrap { text-align: center; }
    canvas {
      border: 2px solid #fff5d6;
      box-shadow: 0 0 24px rgba(255, 215, 120, 0.4);
      background: #0d1026;
    }
    .help { margin-top: 10px; color: #ecf0ff; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Heavenfall Asteroids</h1>
    <canvas id="game" width="760" height="520"></canvas>
    <div class="help">Rotate: ← → / A D &nbsp;|&nbsp; Thrust: ↑ / W &nbsp;|&nbsp; Fire: Space &nbsp;|&nbsp; Restart: R</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const state = {
      keys: {},
      score: 0,
      lives: 3,
      wave: 1,
      gameOver: false,
      won: false,
      flash: 0,
      cooldown: 0,
      particles: [],
      bullets: [],
      rocks: [],
      stars: [],
      clouds: [],
      dt: 1,
    };

    const ship = { x: canvas.width / 2, y: canvas.height / 2, vx: 0, vy: 0, angle: -Math.PI / 2, radius: 16 };

    function rand(min, max) { return Math.random() * (max - min) + min; }
    function wrap(obj) {
      if (obj.x < -30) obj.x = canvas.width + 30;
      if (obj.x > canvas.width + 30) obj.x = -30;
      if (obj.y < -30) obj.y = canvas.height + 30;
      if (obj.y > canvas.height + 30) obj.y = -30;
    }

    function spawnHeavenBackground() {
      state.stars = Array.from({ length: 130 }, () => ({
        x: rand(0, canvas.width), y: rand(0, canvas.height), size: rand(0.8, 2.3), speed: rand(0.08, 0.45), hue: rand(180, 320),
      }));
      state.clouds = Array.from({ length: 14 }, () => ({
        x: rand(-80, canvas.width + 80), y: rand(20, canvas.height - 20), r: rand(28, 68), vx: rand(0.08, 0.26), hue: rand(30, 60), alpha: rand(0.08, 0.18),
      }));
    }

    function spawnRocks(count) {
      for (let i = 0; i < count; i++) {
        const edge = Math.floor(rand(0, 4));
        const rock = {
          x: edge < 2 ? (edge === 0 ? -18 : canvas.width + 18) : rand(0, canvas.width),
          y: edge >= 2 ? (edge === 2 ? -18 : canvas.height + 18) : rand(0, canvas.height),
          vx: rand(-1.8, 1.8),
          vy: rand(-1.8, 1.8),
          angle: rand(0, Math.PI * 2),
          spin: rand(-0.02, 0.02),
          r: rand(22, 46),
          level: 3,
        };
        if (Math.hypot(rock.x - ship.x, rock.y - ship.y) < 120) i--; else state.rocks.push(rock);
      }
    }

    function resetGame() {
      state.score = 0;
      state.lives = 3;
      state.wave = 1;
      state.gameOver = false;
      state.won = false;
      state.flash = 0;
      state.cooldown = 0;
      state.bullets = [];
      state.particles = [];
      state.rocks = [];
      ship.x = canvas.width / 2;
      ship.y = canvas.height / 2;
      ship.vx = 0;
      ship.vy = 0;
      ship.angle = -Math.PI / 2;
      spawnHeavenBackground();
      spawnRocks(6);
    }

    function explode(x, y, count = 24) {
      for (let i = 0; i < count; i++) {
        const a = rand(0, Math.PI * 2);
        const s = rand(0.7, 3.8);
        state.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(20, 45), max: 45, hue: rand(0, 360), size: rand(1.8, 4.2) });
      }
    }

    function shoot() {
      if (state.cooldown > 0 || state.gameOver) return;
      const speed = 8.5;
      state.bullets.push({
        x: ship.x + Math.cos(ship.angle) * 20,
        y: ship.y + Math.sin(ship.angle) * 20,
        vx: ship.vx + Math.cos(ship.angle) * speed,
        vy: ship.vy + Math.sin(ship.angle) * speed,
        life: 70,
      });
      state.cooldown = 10;
    }

    function hit(a, b, r) { return Math.hypot(a.x - b.x, a.y - b.y) < r; }

    function splitRock(rock) {
      if (rock.level <= 1) return;
      for (let i = 0; i < 2; i++) {
        state.rocks.push({
          x: rock.x, y: rock.y,
          vx: rock.vx + rand(-1.4, 1.4), vy: rock.vy + rand(-1.4, 1.4),
          angle: rand(0, Math.PI * 2), spin: rand(-0.04, 0.04),
          r: rock.r * 0.58, level: rock.level - 1,
        });
      }
    }

    function update() {
      if (state.gameOver) return;
      if (state.cooldown > 0) state.cooldown--;
      if (state.flash > 0) state.flash--;

      const rotSpeed = 0.075;
      const thrust = 0.2;
      if (state.keys.ArrowLeft || state.keys.a) ship.angle -= rotSpeed * state.dt;
      if (state.keys.ArrowRight || state.keys.d) ship.angle += rotSpeed * state.dt;
      if (state.keys.ArrowUp || state.keys.w) {
        ship.vx += Math.cos(ship.angle) * thrust * state.dt;
        ship.vy += Math.sin(ship.angle) * thrust * state.dt;
        for (let i = 0; i < 2; i++) {
          state.particles.push({
            x: ship.x - Math.cos(ship.angle) * 14 + rand(-2, 2),
            y: ship.y - Math.sin(ship.angle) * 14 + rand(-2, 2),
            vx: -Math.cos(ship.angle) * rand(1.5, 3.2),
            vy: -Math.sin(ship.angle) * rand(1.5, 3.2),
            life: rand(8, 16), max: 16, hue: rand(20, 60), size: rand(1.2, 2.8),
          });
        }
      }

      ship.vx *= 0.992;
      ship.vy *= 0.992;
      ship.x += ship.vx * state.dt;
      ship.y += ship.vy * state.dt;
      wrap(ship);

      for (const s of state.stars) { s.y += s.speed * state.dt; if (s.y > canvas.height + 2) { s.y = -2; s.x = rand(0, canvas.width); } }
      for (const c of state.clouds) { c.x += c.vx * state.dt; if (c.x > canvas.width + 90) c.x = -90; }

      for (const b of state.bullets) {
        b.x += b.vx * state.dt;
        b.y += b.vy * state.dt;
        b.life -= state.dt;
        wrap(b);
      }
      state.bullets = state.bullets.filter(b => b.life > 0);

      for (const r of state.rocks) {
        r.x += r.vx * state.dt;
        r.y += r.vy * state.dt;
        r.angle += r.spin * state.dt;
        wrap(r);
      }

      for (const p of state.particles) {
        p.x += p.vx * state.dt;
        p.y += p.vy * state.dt;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.life -= state.dt;
      }
      state.particles = state.particles.filter(p => p.life > 0);

      for (const b of state.bullets) {
        for (const r of state.rocks) {
          if (hit(b, r, r.r)) {
            b.life = -1;
            r.dead = true;
            state.score += r.level * 20;
            explode(r.x, r.y, 28);
            splitRock(r);
            break;
          }
        }
      }
      state.rocks = state.rocks.filter(r => !r.dead);

      for (const r of state.rocks) {
        if (hit(ship, r, ship.radius + r.r * 0.75) && state.flash === 0) {
          state.lives--;
          state.flash = 60;
          explode(ship.x, ship.y, 40);
          ship.x = canvas.width / 2;
          ship.y = canvas.height / 2;
          ship.vx = 0;
          ship.vy = 0;
          if (state.lives <= 0) {
            state.gameOver = true;
            state.won = false;
          }
          break;
        }
      }

      if (!state.gameOver && state.rocks.length === 0) {
        state.wave++;
        if (state.wave > 5) {
          state.gameOver = true;
          state.won = true;
        } else {
          spawnRocks(4 + state.wave * 2);
        }
      }
    }

    function drawBackground() {
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, '#1e2664');
      g.addColorStop(0.45, '#5f3bb3');
      g.addColorStop(1, '#eb9cf7');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 8; i++) {
        ctx.strokeStyle = `hsla(${(i * 45 + performance.now() * 0.02) % 360},100%,80%,0.18)`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, i * 70 + (performance.now() * 0.03 % 70));
        ctx.lineTo(canvas.width, i * 70 + 45 + (performance.now() * 0.03 % 70));
        ctx.stroke();
      }

      for (const c of state.clouds) {
        const cg = ctx.createRadialGradient(c.x, c.y, c.r * 0.2, c.x, c.y, c.r);
        cg.addColorStop(0, `hsla(${c.hue},100%,95%,${c.alpha + 0.08})`);
        cg.addColorStop(1, `hsla(${c.hue},100%,90%,0)`);
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const s of state.stars) {
        ctx.fillStyle = `hsla(${s.hue},100%,88%,0.9)`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }
    }

    function drawShip() {
      ctx.save();
      ctx.translate(ship.x, ship.y);
      ctx.rotate(ship.angle + Math.PI / 2);

      const hitBlink = state.flash > 0 && Math.floor(state.flash / 4) % 2 === 0;
      ctx.fillStyle = hitBlink ? '#ffd4d4' : '#be1c27';
      ctx.strokeStyle = '#ffd56a';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(12, -4);
      ctx.lineTo(18, 12);
      ctx.lineTo(7, 7);
      ctx.lineTo(0, 18);
      ctx.lineTo(-7, 7);
      ctx.lineTo(-18, 12);
      ctx.lineTo(-12, -4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ff9a9a';
      ctx.beginPath();
      ctx.moveTo(0, -8);
      ctx.lineTo(5, 6);
      ctx.lineTo(0, 2);
      ctx.lineTo(-5, 6);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawAngelRock(r) {
      ctx.save();
      ctx.translate(r.x, r.y);
      ctx.rotate(r.angle);

      ctx.strokeStyle = 'hsla(48,100%,80%,0.8)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.ellipse(0, 0, r.r * 0.85, r.r * 0.62, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(0, 0, r.r * 1.05, r.r * 0.82, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'hsla(42,90%,86%,0.95)';
      ctx.beginPath();
      ctx.arc(0, 0, r.r * 0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#2b2442';
      ctx.beginPath();
      ctx.arc(0, 0, r.r * 0.12, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'hsla(200,100%,85%,0.65)';
      ctx.beginPath();
      ctx.moveTo(0, -r.r * 0.7);
      ctx.quadraticCurveTo(-r.r * 0.95, -r.r * 0.15, -r.r * 0.75, r.r * 0.45);
      ctx.quadraticCurveTo(-r.r * 0.4, r.r * 0.35, 0, r.r * 0.7);
      ctx.moveTo(0, -r.r * 0.7);
      ctx.quadraticCurveTo(r.r * 0.95, -r.r * 0.15, r.r * 0.75, r.r * 0.45);
      ctx.quadraticCurveTo(r.r * 0.4, r.r * 0.35, 0, r.r * 0.7);
      ctx.stroke();
      ctx.restore();
    }

    function drawBullets() {
      for (const b of state.bullets) {
        ctx.fillStyle = '#fff6c8';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawParticles() {
      for (const p of state.particles) {
        ctx.fillStyle = `hsla(${p.hue},100%,65%,${Math.max(0, p.life / p.max)})`;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
    }

    function drawHud() {
      ctx.fillStyle = '#fff5cf';
      ctx.font = '18px Arial';
      ctx.fillText(`Score: ${state.score}`, 14, 24);
      ctx.fillText(`Lives: ${state.lives}`, 14, 48);
      ctx.fillText(`Wave: ${state.wave}/5`, 14, 72);

      if (state.gameOver) {
        ctx.fillStyle = 'rgba(16, 8, 28, 0.55)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = state.won ? '#d8ffea' : '#ffd4d4';
        ctx.font = '44px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(state.won ? 'ASCENDED' : 'FALLEN', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '20px Arial';
        ctx.fillStyle = '#fff7de';
        ctx.fillText('Press R to restart', canvas.width / 2, canvas.height / 2 + 28);
        ctx.textAlign = 'left';
      }
    }

    let last = performance.now();
    function loop(now = performance.now()) {
      const delta = Math.min(2, (now - last) / 16.6667);
      last = now;
      state.dt = delta;
      update();
      drawBackground();
      for (const r of state.rocks) drawAngelRock(r);
      drawParticles();
      drawBullets();
      drawShip();
      drawHud();
      requestAnimationFrame(loop);
    }

    addEventListener('keydown', (e) => {
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      state.keys[key] = true;
      if (e.key === ' ') { e.preventDefault(); shoot(); }
      if ((e.key === 'r' || e.key === 'R') && state.gameOver) resetGame();
    });
    addEventListener('keyup', (e) => {
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      state.keys[key] = false;
    });

    resetGame();
    loop();
  </script>
</body>
</html>
