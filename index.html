<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heavenfall Asteroids</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6fbff;
      font-family: Arial, sans-serif;
      color: #f7f8ff;
    }
    .wrap { text-align: center; }
    canvas {
      border: 2px solid #fff5d6;
      box-shadow: 0 0 24px rgba(255, 215, 120, 0.4);
      background: #0d1026;
    }
    .help { margin-top: 10px; color: #ecf0ff; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Heavenfall Asteroids</h1>
    <canvas id="game" width="760" height="520"></canvas>
    <div class="help">Rotate: ← → / A D &nbsp;|&nbsp; Thrust: ↑ / W &nbsp;|&nbsp; Reverse: ↓ / S &nbsp;|&nbsp; Fire: Space</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const WORLD = { w: 1800, h: 1400 };
    const state = {
      keys: {},
      score: 0,
      lives: 3,
      wave: 1,
      xp: 0,
      level: 1,
      nextLevelXp: 60,
      pendingLevelUps: 0,
      upgradeMenu: false,
      started: false,
      shieldLevel: 0,
      gunLevel: 0,
      speedLevel: 0,
      spawnTimer: 90,
      gameOver: false,
      won: false,
      flash: 0,
      cooldown: 0,
      particles: [],
      bullets: [],
      rocks: [],
      xpOrbs: [],
      stars: [],
      clouds: [],
      dt: 1,
    };

    const ship = { x: WORLD.w / 2, y: WORLD.h / 2, vx: 0, vy: 0, angle: -Math.PI / 2, radius: 16 };

    function rand(min, max) { return Math.random() * (max - min) + min; }
    function camera() {
      return {
        x: Math.max(0, Math.min(WORLD.w - canvas.width, ship.x - canvas.width / 2)),
        y: Math.max(0, Math.min(WORLD.h - canvas.height, ship.y - canvas.height / 2)),
      };
    }

    function spawnHeavenBackground() {
      state.stars = Array.from({ length: 130 }, () => ({
        x: rand(0, WORLD.w), y: rand(0, WORLD.h), size: rand(0.8, 2.3), speed: rand(0.08, 0.45), hue: rand(180, 320),
      }));
      state.clouds = Array.from({ length: 14 }, () => ({
        x: rand(-80, WORLD.w + 80), y: rand(20, WORLD.h - 20), r: rand(28, 68), vx: rand(0.08, 0.26), hue: rand(30, 60), alpha: rand(0.08, 0.18),
      }));
    }

    function spawnRocks(count) {
      for (let i = 0; i < count; i++) {
        const edge = Math.floor(rand(0, 4));
        const rock = {
          x: edge < 2 ? (edge === 0 ? -18 : WORLD.w + 18) : rand(0, WORLD.w),
          y: edge >= 2 ? (edge === 2 ? -18 : WORLD.h + 18) : rand(0, WORLD.h),
          vx: rand(-1.8, 1.8),
          vy: rand(-1.8, 1.8),
          angle: rand(0, Math.PI * 2),
          spin: rand(-0.02, 0.02),
          r: rand(18, 44),
          type: ['seraph', 'warden', 'archon'][Math.floor(rand(0, 3))],
        };
        if (Math.hypot(rock.x - ship.x, rock.y - ship.y) < 120) i--; else state.rocks.push(rock);
      }
    }

    function resetGame() {
      state.score = 0;
      state.lives = 3;
      state.wave = 1;
      state.xp = 0;
      state.level = 1;
      state.nextLevelXp = 60;
      state.pendingLevelUps = 0;
      state.upgradeMenu = false;
      state.started = false;
      state.shieldLevel = 0;
      state.gunLevel = 0;
      state.speedLevel = 0;
      state.spawnTimer = 90;
      state.gameOver = false;
      state.won = false;
      state.flash = 0;
      state.cooldown = 0;
      state.bullets = [];
      state.particles = [];
      state.rocks = [];
      state.xpOrbs = [];
      ship.x = WORLD.w / 2;
      ship.y = WORLD.h / 2;
      ship.vx = 0;
      ship.vy = 0;
      ship.angle = -Math.PI / 2;
      spawnHeavenBackground();
      spawnRocks(6);
    }

    function explode(x, y, count = 24) {
      for (let i = 0; i < count; i++) {
        const a = rand(0, Math.PI * 2);
        const s = rand(0.7, 3.8);
        state.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(20, 45), max: 45, hue: rand(0, 360), size: rand(1.8, 4.2) });
      }
    }

    function shoot() {
      if (state.cooldown > 0 || state.gameOver) return;
      const speed = 8.5;
      const spread = state.gunLevel >= 2 ? 0.18 : state.gunLevel >= 1 ? 0.08 : 0;
      const shots = state.gunLevel >= 2 ? [-spread, 0, spread] : [0];
      for (const s of shots) {
        const a = ship.angle + s;
        state.bullets.push({
          x: ship.x + Math.cos(a) * 20,
          y: ship.y + Math.sin(a) * 20,
          vx: ship.vx + Math.cos(a) * speed,
          vy: ship.vy + Math.sin(a) * speed,
          life: 70 + state.gunLevel * 12,
        });
      }
      state.cooldown = Math.max(5, 10 - state.gunLevel * 2);
    }

    function hit(a, b, r) { return Math.hypot(a.x - b.x, a.y - b.y) < r; }

    function update() {
      if (state.gameOver || !state.started) return;
      if (state.upgradeMenu) return;
      if (state.cooldown > 0) state.cooldown--;
      if (state.flash > 0) state.flash--;
      state.spawnTimer -= state.dt;
      if (state.spawnTimer <= 0) {
        spawnRocks(1 + Math.floor(state.level / 3));
        state.spawnTimer = Math.max(30, 90 - state.level * 3 + rand(-12, 12));
      }

      const rotSpeed = 0.075;
      const thrust = 0.2 + state.speedLevel * 0.055;
      if (state.keys.ArrowLeft || state.keys.a) ship.angle -= rotSpeed * state.dt;
      if (state.keys.ArrowRight || state.keys.d) ship.angle += rotSpeed * state.dt;
      if (state.keys.ArrowUp || state.keys.w) {
        ship.vx += Math.cos(ship.angle) * thrust * state.dt;
        ship.vy += Math.sin(ship.angle) * thrust * state.dt;
        for (let i = 0; i < 2; i++) {
          state.particles.push({
            x: ship.x - Math.cos(ship.angle) * 14 + rand(-2, 2),
            y: ship.y - Math.sin(ship.angle) * 14 + rand(-2, 2),
            vx: -Math.cos(ship.angle) * rand(1.5, 3.2),
            vy: -Math.sin(ship.angle) * rand(1.5, 3.2),
            life: rand(8, 16), max: 16, hue: rand(20, 60), size: rand(1.2, 2.8),
          });
        }
      }
      if (state.keys.ArrowDown || state.keys.s) {
        ship.vx -= Math.cos(ship.angle) * thrust * 0.66 * state.dt;
        ship.vy -= Math.sin(ship.angle) * thrust * 0.66 * state.dt;
      }

      ship.vx *= 0.9935;
      ship.vy *= 0.9935;
      ship.x += ship.vx * state.dt;
      ship.y += ship.vy * state.dt;
      ship.x = Math.max(ship.radius, Math.min(WORLD.w - ship.radius, ship.x));
      ship.y = Math.max(ship.radius, Math.min(WORLD.h - ship.radius, ship.y));

      for (const s of state.stars) { s.y += s.speed * state.dt; if (s.y > WORLD.h + 2) { s.y = -2; s.x = rand(0, WORLD.w); } }
      for (const c of state.clouds) { c.x += c.vx * state.dt; if (c.x > WORLD.w + 90) c.x = -90; }

      for (const b of state.bullets) {
        b.x += b.vx * state.dt;
        b.y += b.vy * state.dt;
        b.life -= state.dt;
        if (b.x < 0 || b.x > WORLD.w || b.y < 0 || b.y > WORLD.h) b.life = -1;
      }
      state.bullets = state.bullets.filter(b => b.life > 0);

      for (const r of state.rocks) {
        r.x += r.vx * state.dt;
        r.y += r.vy * state.dt;
        r.angle += r.spin * state.dt;
        if (r.x < r.r || r.x > WORLD.w - r.r) r.vx *= -1;
        if (r.y < r.r || r.y > WORLD.h - r.r) r.vy *= -1;
        r.x = Math.max(r.r, Math.min(WORLD.w - r.r, r.x));
        r.y = Math.max(r.r, Math.min(WORLD.h - r.r, r.y));
      }

      for (const p of state.particles) {
        p.x += p.vx * state.dt;
        p.y += p.vy * state.dt;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.life -= state.dt;
      }
      state.particles = state.particles.filter(p => p.life > 0);

      for (const b of state.bullets) {
        for (const r of state.rocks) {
          if (hit(b, r, r.r)) {
            b.life = -1;
            r.dead = true;
            state.score += 20;
            explode(r.x, r.y, 28);
            state.xpOrbs.push({ x: r.x, y: r.y, value: rand(20, 36), r: 7, hue: rand(170, 320) });
            break;
          }
        }
      }
      state.rocks = state.rocks.filter(r => !r.dead);

      for (const r of state.rocks) {
        if (hit(ship, r, ship.radius + r.r * 0.75) && state.flash === 0) {
          if (state.shieldLevel > 0) {
            state.shieldLevel--;
            state.flash = 20;
            r.dead = true;
            explode(r.x, r.y, 18);
            continue;
          }
          state.lives--;
          state.flash = 60;
          explode(ship.x, ship.y, 40);
          ship.x = WORLD.w / 2;
          ship.y = WORLD.h / 2;
          ship.vx = 0;
          ship.vy = 0;
          if (state.lives <= 0) {
            state.gameOver = true;
            state.won = false;
          }
          break;
        }
      }
      state.rocks = state.rocks.filter(r => !r.dead);

      for (const orb of state.xpOrbs) {
        const dx = ship.x - orb.x;
        const dy = ship.y - orb.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 140) {
          orb.x += (dx / (dist || 1)) * 2.2 * state.dt;
          orb.y += (dy / (dist || 1)) * 2.2 * state.dt;
        }
        if (dist < ship.radius + orb.r + 6) {
          orb.dead = true;
          state.xp += orb.value;
          while (state.xp >= state.nextLevelXp) {
            state.xp -= state.nextLevelXp;
            state.level++;
            state.nextLevelXp = Math.floor(state.nextLevelXp * 1.2);
            state.pendingLevelUps++;
          }
        }
      }
      state.xpOrbs = state.xpOrbs.filter(o => !o.dead);
      if (state.pendingLevelUps > 0) state.upgradeMenu = true;
    }

    function drawBackground(cam) {
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, '#1e2664');
      g.addColorStop(0.45, '#5f3bb3');
      g.addColorStop(1, '#eb9cf7');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 8; i++) {
        ctx.strokeStyle = `hsla(${(i * 45 + performance.now() * 0.02) % 360},100%,80%,0.18)`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, i * 70 + ((performance.now() * 0.03 + cam.y * 0.25) % 70));
        ctx.lineTo(canvas.width, i * 70 + 45 + ((performance.now() * 0.03 + cam.y * 0.25) % 70));
        ctx.stroke();
      }

      for (const c of state.clouds) {
        const x = c.x - cam.x;
        const y = c.y - cam.y;
        const cg = ctx.createRadialGradient(x, y, c.r * 0.2, x, y, c.r);
        cg.addColorStop(0, `hsla(${c.hue},100%,95%,${c.alpha + 0.08})`);
        cg.addColorStop(1, `hsla(${c.hue},100%,90%,0)`);
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.arc(x, y, c.r, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const s of state.stars) {
        ctx.fillStyle = `hsla(${s.hue},100%,88%,0.9)`;
        ctx.fillRect(s.x - cam.x, s.y - cam.y, s.size, s.size);
      }
    }

    function drawShip(cam) {
      ctx.save();
      ctx.translate(ship.x - cam.x, ship.y - cam.y);
      ctx.rotate(ship.angle + Math.PI / 2);

      const hitBlink = state.flash > 0 && Math.floor(state.flash / 4) % 2 === 0;
      ctx.fillStyle = hitBlink ? '#ffd4d4' : '#be1c27';
      ctx.strokeStyle = '#ffd56a';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(12, -4);
      ctx.lineTo(18, 12);
      ctx.lineTo(7, 7);
      ctx.lineTo(0, 18);
      ctx.lineTo(-7, 7);
      ctx.lineTo(-18, 12);
      ctx.lineTo(-12, -4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ff9a9a';
      ctx.beginPath();
      ctx.moveTo(0, -8);
      ctx.lineTo(5, 6);
      ctx.lineTo(0, 2);
      ctx.lineTo(-5, 6);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
      if (state.shieldLevel > 0) {
        ctx.strokeStyle = `hsla(${190 + performance.now() * 0.05},100%,80%,0.8)`;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(ship.x - cam.x, ship.y - cam.y, ship.radius + 8 + state.shieldLevel * 2, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawAngelRock(r, cam) {
      ctx.save();
      ctx.translate(r.x - cam.x, r.y - cam.y);
      ctx.rotate(r.angle);

      if (r.type === 'seraph') {
        ctx.strokeStyle = 'hsla(48,100%,80%,0.8)';
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.ellipse(0, 0, r.r * 0.9, r.r * 0.62, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(0, 0, r.r * 1.1, r.r * 0.82, 0, 0, Math.PI * 2); ctx.stroke();
      } else if (r.type === 'warden') {
        ctx.strokeStyle = 'hsla(195,100%,80%,0.85)';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = (Math.PI * 2 * i) / 6;
          const px = Math.cos(a) * r.r * 0.9;
          const py = Math.sin(a) * r.r * 0.9;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      } else {
        ctx.strokeStyle = 'hsla(300,100%,80%,0.75)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, -r.r);
        ctx.lineTo(r.r * 0.5, 0);
        ctx.lineTo(0, r.r);
        ctx.lineTo(-r.r * 0.5, 0);
        ctx.closePath();
        ctx.stroke();
      }

      ctx.fillStyle = 'hsla(42,90%,86%,0.95)';
      ctx.beginPath(); ctx.arc(0, 0, r.r * 0.24, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2b2442';
      ctx.beginPath(); ctx.arc(0, 0, r.r * 0.11, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawBullets(cam) {
      for (const b of state.bullets) {
        ctx.fillStyle = '#fff6c8';
        ctx.beginPath();
        ctx.arc(b.x - cam.x, b.y - cam.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    function drawOrbs(cam) {
      for (const o of state.xpOrbs) {
        ctx.fillStyle = `hsla(${o.hue},100%,70%,0.95)`;
        ctx.beginPath();
        ctx.arc(o.x - cam.x, o.y - cam.y, o.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawParticles(cam) {
      for (const p of state.particles) {
        ctx.fillStyle = `hsla(${p.hue},100%,65%,${Math.max(0, p.life / p.max)})`;
        ctx.fillRect(p.x - cam.x, p.y - cam.y, p.size, p.size);
      }
    }

    function drawHud() {
      ctx.fillStyle = '#fff5cf';
      ctx.font = '18px Arial';
      ctx.fillText(`Score: ${state.score}`, 14, 24);
      ctx.fillText(`Lives: ${state.lives}`, 14, 48);
      ctx.fillText(`Level: ${state.level}`, 14, 72);
      ctx.fillText(`XP: ${state.xp}/${state.nextLevelXp}`, 14, 96);
      ctx.fillText(`Upgrades S/G/Spd: ${state.shieldLevel}/${state.gunLevel}/${state.speedLevel}`, 14, 120);

      if (state.upgradeMenu) {
        ctx.fillStyle = 'rgba(8, 6, 20, 0.72)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff7de';
        ctx.font = '30px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Level Up! Choose Upgrade', canvas.width / 2, canvas.height / 2 - 70);
        ctx.font = '22px Arial';
        ctx.fillText('1) Shield (+1 charge)', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillText('2) Better Guns (+fire rate/spread)', canvas.width / 2, canvas.height / 2 + 20);
        ctx.fillText('3) More Speed (+thrust)', canvas.width / 2, canvas.height / 2 + 60);
        ctx.textAlign = 'left';
      } else if (!state.started) {
        ctx.fillStyle = 'rgba(5, 5, 18, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#8ef3ff';
        ctx.textAlign = 'center';
        ctx.font = '38px Arial';
        ctx.fillText('HEAVENFALL PROTOCOL', canvas.width / 2, 120);
        ctx.fillStyle = '#ffecc2';
        ctx.font = '20px Arial';
        ctx.fillText('In the Neon Throne Sector, angelic wardens fell to corrupted code.', canvas.width / 2, 190);
        ctx.fillText('You are the Infernal Pilot: part demon, part machine, last firewall.', canvas.width / 2, 220);
        ctx.fillText('Harvest soul-XP. Upgrade. Purge the orbit.', canvas.width / 2, 250);
        ctx.fillStyle = '#ff7ccf';
        ctx.font = '26px Arial';
        ctx.fillText('Press ENTER to Start Game', canvas.width / 2, 320);
        ctx.textAlign = 'left';
      } else if (state.gameOver) {
        ctx.fillStyle = 'rgba(16, 8, 28, 0.55)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = state.won ? '#d8ffea' : '#ffd4d4';
        ctx.font = '44px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(state.won ? 'ASCENDED' : 'FALLEN', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '20px Arial';
        ctx.fillStyle = '#fff7de';
        ctx.fillText('Press R to restart', canvas.width / 2, canvas.height / 2 + 28);
        ctx.textAlign = 'left';
      }
    }

    let last = performance.now();
    function loop(now = performance.now()) {
      const delta = Math.min(2, (now - last) / 16.6667);
      last = now;
      state.dt = delta;
      update();
      const cam = camera();
      drawBackground(cam);
      for (const r of state.rocks) drawAngelRock(r, cam);
      drawParticles(cam);
      drawBullets(cam);
      drawOrbs(cam);
      drawShip(cam);
      drawHud();
      requestAnimationFrame(loop);
    }

    addEventListener('keydown', (e) => {
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      state.keys[key] = true;
      if (e.key === ' ') { e.preventDefault(); shoot(); }
      if ((e.key === 'r' || e.key === 'R') && state.gameOver) resetGame();
      if (e.key === 'Enter' && !state.started) state.started = true;
      if (state.upgradeMenu && (key === '1' || key === '2' || key === '3')) {
        if (key === '1') state.shieldLevel++;
        if (key === '2') state.gunLevel = Math.min(3, state.gunLevel + 1);
        if (key === '3') state.speedLevel = Math.min(5, state.speedLevel + 1);
        state.pendingLevelUps--;
        if (state.pendingLevelUps <= 0) state.upgradeMenu = false;
      }
    });
    addEventListener('keyup', (e) => {
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      state.keys[key] = false;
    });

    resetGame();
    loop();
  </script>
</body>
</html>
