<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Invaders</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050910;
      font-family: Arial, sans-serif;
      color: #dce6ff;
    }
    .wrap { text-align: center; }
    canvas {
      border: 2px solid #8db3ff;
      background: radial-gradient(circle at top, #0b1324, #050910 70%);
      box-shadow: 0 0 20px rgba(141, 179, 255, 0.35);
    }
    .help { margin-top: 10px; opacity: 0.9; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Mini Invaders</h1>
    <canvas id="game" width="640" height="480"></canvas>
    <div class="help">Move: ← → or A D &nbsp;|&nbsp; Shoot: Space &nbsp;|&nbsp; Restart: R</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const state = {
      keys: {},
      stars: [],
      score: 0,
      lives: 3,
      gameOver: false,
      won: false,
      hitFlash: 0,
      cooldown: 0,
      bullets: [],
      enemyBullets: [],
      explosions: [],
      enemyDir: 1,
      enemyStepDown: 14,
      enemyMoveTimer: 0,
      enemyMoveInterval: 40,
    };

    const player = { w: 46, h: 22, x: canvas.width / 2 - 23, y: canvas.height - 46, speed: 0.42, vx: 0 };
    const enemies = [];

    function resetStars() {
      state.stars = Array.from({ length: 80 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: 1 + Math.random() * 2,
        speed: 0.2 + Math.random() * 0.8,
        hue: 180 + Math.random() * 160,
      }));
    }

    function resetEnemies() {
      enemies.length = 0;
      const rows = 5, cols = 9;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: 72 + c * 56,
            y: 56 + r * 40,
            w: 32,
            h: 20,
            alive: true,
          });
        }
      }
    }

    function resetGame() {
      state.score = 0;
      state.lives = 3;
      state.gameOver = false;
      state.won = false;
      state.hitFlash = 0;
      state.bullets = [];
      state.enemyBullets = [];
      state.explosions = [];
      state.enemyDir = 1;
      state.enemyMoveTimer = 0;
      state.enemyMoveInterval = 40;
      player.x = canvas.width / 2 - player.w / 2;
      player.vx = 0;
      resetStars();
      resetEnemies();
    }

    function shoot() {
      if (state.cooldown > 0 || state.gameOver) return;
      state.bullets.push({ x: player.x + player.w / 2 - 2, y: player.y - 10, w: 4, h: 10, speed: 8 });
      state.cooldown = 14;
    }

    function rectHit(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function spawnExplosion(x, y) {
      for (let i = 0; i < 26; i++) {
        const angle = (Math.PI * 2 * i) / 26 + Math.random() * 0.2;
        const speed = 1.2 + Math.random() * 3.2;
        state.explosions.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 36 + Math.floor(Math.random() * 10),
          maxLife: 46,
          hue: Math.floor(Math.random() * 360),
          size: 2 + Math.random() * 3,
        });
      }
    }

    function update() {
      if (state.gameOver) return;

      for (const s of state.stars) {
        s.y += s.speed;
        if (s.y > canvas.height + 2) {
          s.y = -2;
          s.x = Math.random() * canvas.width;
        }
      }

      const movingLeft = state.keys.ArrowLeft || state.keys.a;
      const movingRight = state.keys.ArrowRight || state.keys.d;
      if (movingLeft) player.vx -= player.speed;
      if (movingRight) player.vx += player.speed;
      player.vx *= 0.86;
      if (!movingLeft && !movingRight && Math.abs(player.vx) < 0.1) player.vx = 0;
      player.vx = Math.max(-5.5, Math.min(5.5, player.vx));
      player.x += player.vx;
      player.x = Math.max(8, Math.min(canvas.width - player.w - 8, player.x));

      if (state.cooldown > 0) state.cooldown--;
      if (state.hitFlash > 0) state.hitFlash--;

      state.bullets.forEach(b => b.y -= b.speed);
      state.enemyBullets.forEach(b => b.y += b.speed);
      state.bullets = state.bullets.filter(b => b.y + b.h > 0);
      state.enemyBullets = state.enemyBullets.filter(b => b.y < canvas.height + 20);
      for (const p of state.explosions) {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.98;
        p.vy *= 0.98;
        p.life--;
      }
      state.explosions = state.explosions.filter(p => p.life > 0);

      state.enemyMoveTimer++;
      if (state.enemyMoveTimer >= state.enemyMoveInterval) {
        state.enemyMoveTimer = 0;
        let turn = false;
        for (const e of enemies) {
          if (!e.alive) continue;
          e.x += 10 * state.enemyDir;
          if (e.x < 12 || e.x + e.w > canvas.width - 12) turn = true;
        }
        if (turn) {
          state.enemyDir *= -1;
          for (const e of enemies) {
            if (!e.alive) continue;
            e.y += state.enemyStepDown;
            if (e.y + e.h >= player.y) {
              state.gameOver = true;
              state.won = false;
            }
          }
        }
      }

      for (const b of state.bullets) {
        for (const e of enemies) {
          if (e.alive && rectHit(b, e)) {
            e.alive = false;
            b.y = -999;
            state.score += 10;
            state.enemyMoveInterval = Math.max(12, state.enemyMoveInterval - 0.25);
            spawnExplosion(e.x + e.w / 2, e.y + e.h / 2);
            break;
          }
        }
      }

      const aliveEnemies = enemies.filter(e => e.alive);
      if (aliveEnemies.length === 0) {
        state.gameOver = true;
        state.won = true;
      } else if (Math.random() < 0.03) {
        const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
        state.enemyBullets.push({ x: shooter.x + shooter.w / 2 - 2, y: shooter.y + shooter.h, w: 4, h: 10, speed: 3.4 });
      }

      for (const b of state.enemyBullets) {
        if (rectHit(b, player)) {
          b.y = canvas.height + 999;
          state.lives--;
          state.hitFlash = 14;
          if (state.lives <= 0) {
            state.gameOver = true;
            state.won = false;
          }
        }
      }
    }

    function drawBackground() {
      const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bg.addColorStop(0, '#070e1f');
      bg.addColorStop(1, '#04070f');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const s of state.stars) {
        ctx.fillStyle = `hsla(${s.hue}, 100%, 75%, 0.8)`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }
    }

    function drawPlayer() {
      const hitTint = state.hitFlash > 0 ? (state.hitFlash % 4 < 2 ? '#ff3a3a' : '#ffd3d3') : '#c92222';
      ctx.fillStyle = hitTint;
      ctx.beginPath();
      ctx.moveTo(player.x + player.w / 2, player.y - 12);
      ctx.lineTo(player.x + player.w * 0.78, player.y + player.h * 0.38);
      ctx.lineTo(player.x + player.w, player.y + player.h + 2);
      ctx.lineTo(player.x + player.w * 0.72, player.y + player.h * 0.84);
      ctx.lineTo(player.x + player.w * 0.62, player.y + player.h + 8);
      ctx.lineTo(player.x + player.w * 0.5, player.y + player.h * 0.8);
      ctx.lineTo(player.x + player.w * 0.38, player.y + player.h + 8);
      ctx.lineTo(player.x + player.w * 0.28, player.y + player.h * 0.84);
      ctx.lineTo(player.x, player.y + player.h + 2);
      ctx.lineTo(player.x + player.w * 0.22, player.y + player.h * 0.38);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ff9b9b';
      ctx.beginPath();
      ctx.moveTo(player.x + player.w * 0.5, player.y + 3);
      ctx.lineTo(player.x + player.w * 0.62, player.y + player.h * 0.65);
      ctx.lineTo(player.x + player.w * 0.5, player.y + player.h * 0.56);
      ctx.lineTo(player.x + player.w * 0.38, player.y + player.h * 0.65);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#ffcf66';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(player.x + player.w * 0.15, player.y + player.h * 0.82);
      ctx.lineTo(player.x + player.w * 0.02, player.y + player.h + 8);
      ctx.moveTo(player.x + player.w * 0.85, player.y + player.h * 0.82);
      ctx.lineTo(player.x + player.w * 0.98, player.y + player.h + 8);
      ctx.stroke();
    }

    function drawEnemies() {
      for (const e of enemies) {
        if (!e.alive) continue;
        const t = performance.now() * 0.004 + e.x * 0.02;
        const wingPulse = Math.sin(t) * 4;

        ctx.strokeStyle = `hsla(${210 + Math.sin(t) * 50}, 100%, 78%, 0.75)`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(e.x + e.w / 2, e.y + e.h / 2, e.w * 0.72, e.h * 0.55, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(e.x + e.w / 2, e.y + e.h / 2, e.w * 0.95, e.h * 0.78, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#ffe8c2';
        ctx.beginPath();
        ctx.arc(e.x + e.w / 2, e.y + e.h / 2, 5.6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#282034';
        ctx.beginPath();
        ctx.arc(e.x + e.w / 2, e.y + e.h / 2, 2.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'hsla(40, 100%, 80%, 0.8)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(e.x + e.w / 2, e.y - 5 - wingPulse * 0.5);
        ctx.quadraticCurveTo(e.x + e.w * 0.18, e.y + e.h * 0.14, e.x - 7, e.y + e.h * 0.48);
        ctx.quadraticCurveTo(e.x + e.w * 0.18, e.y + e.h * 0.62, e.x + e.w / 2, e.y + e.h + 5);
        ctx.moveTo(e.x + e.w / 2, e.y - 5 - wingPulse * 0.5);
        ctx.quadraticCurveTo(e.x + e.w * 0.82, e.y + e.h * 0.14, e.x + e.w + 7, e.y + e.h * 0.48);
        ctx.quadraticCurveTo(e.x + e.w * 0.82, e.y + e.h * 0.62, e.x + e.w / 2, e.y + e.h + 5);
        ctx.stroke();
      }
    }

    function drawBullets() {
      for (const b of state.bullets) {
        const pulse = (Math.sin((b.y + performance.now() * 0.2) * 0.08) + 1) / 2;
        ctx.fillStyle = `hsl(${200 + pulse * 120} 100% 70%)`;
        ctx.fillRect(b.x, b.y, b.w, b.h);
      }
      for (const b of state.enemyBullets) {
        const pulse = (Math.sin((b.y + performance.now() * 0.15) * 0.09) + 1) / 2;
        ctx.fillStyle = `hsl(${20 + pulse * 300} 100% 70%)`;
        ctx.fillRect(b.x, b.y, b.w, b.h);
      }
    }

    function drawExplosions() {
      for (const p of state.explosions) {
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = `hsla(${p.hue}, 100%, 60%, ${alpha})`;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
    }

    function drawHud() {
      ctx.fillStyle = '#dce6ff';
      ctx.font = '18px Arial';
      ctx.fillText(`Score: ${state.score}`, 16, 26);
      ctx.fillText(`Lives: ${state.lives}`, canvas.width - 96, 26);

      if (state.gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = state.won ? '#8effb4' : '#ffd1d1';
        ctx.font = '42px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(state.won ? 'YOU WIN!' : 'GAME OVER', canvas.width / 2, canvas.height / 2 - 12);
        ctx.fillStyle = '#dce6ff';
        ctx.font = '20px Arial';
        ctx.fillText('Press R to restart', canvas.width / 2, canvas.height / 2 + 28);
        ctx.textAlign = 'left';
      }
    }

    function loop() {
      update();
      drawBackground();
      drawPlayer();
      drawEnemies();
      drawBullets();
      drawExplosions();
      drawHud();
      requestAnimationFrame(loop);
    }

    addEventListener('keydown', (e) => {
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      state.keys[key] = true;
      if (e.key === ' ') {
        e.preventDefault();
        shoot();
      }
      if ((e.key === 'r' || e.key === 'R') && state.gameOver) resetGame();
      if (key === 'ArrowLeft') player.vx -= 1.6;
      if (key === 'ArrowRight') player.vx += 1.6;
    });

    addEventListener('keyup', (e) => {
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      state.keys[key] = false;
    });

    resetGame();
    loop();
  </script>
</body>
</html>
